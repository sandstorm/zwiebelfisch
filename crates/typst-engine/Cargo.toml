[package]
name = "typst-engine"
version = "0.0.0"
edition = "2024"
publish = false
description = "Typst compiler, SVG renderer and source<->preview hit-testing for the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = "=0.15.1"
typst-svg = "=0.15.1"
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# must match the wasm-bindgen CLI pinned in mise.toml
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
