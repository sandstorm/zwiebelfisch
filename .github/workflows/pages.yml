# The documentation as a GitHub Pages site, https://<owner>.github.io/<repo>/: the HTML pages (mise run docs:html) at
# the top, the book as zwiebelfisch.pdf next to them, and the demo, built as a static site, under demo/. Published on every
# push to main and by hand (Actions → Pages → Run workflow).
#
# The demo there is the static site (vite --mode static, demo/static-site.ts): it opens the Documentation example, this
# book, editable in the page without a server (the engine is WebAssembly; @preview packages come from
# packages.typst.org) and saves nothing; a banner says so. Collaborate and GitLab need the playground server (mise run
# demo, or the Docker image) and are shown unavailable. The docs pages link to it ("Try it" in their header).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: mise run docs:html
      - run: mise run docs:pdf
      # relative asset URLs: the site lives under /<repo>/demo/, not at a server's root
      - run: mise run build:demo -- --base ./ --mode static
      - name: Assemble the site
        run: |
          mkdir -p dist/pages
          cp -R dist/docs/html/. dist/pages/
          cp dist/docs/zwiebelfisch.pdf dist/pages/
          cp -R dist/demo dist/pages/demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
