# The checks a developer runs before a commit (the same mise tasks), plus the end-to-end tests (Chromium) as a job of
# their own. Runs on every push and pull request, and for a version tag when release.yml calls it before publishing.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # builds the engine once and caches it (.github/actions/setup), so the jobs after it find it built
  engine:
    # a pull request from this repository's own branch is checked by its push already
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

  check:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: mise run check:ci
      - run: mise run typecheck
      - run: mise run quality
      - run: mise run test:unit
      # the Go server's modules and build cache, keyed by go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('server/**/*.go') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - run: mise run server:test
      - run: mise run check:examples
      - run: mise run docs:pdf
      - run: mise run docs:html

  e2e:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Chromium only, with the system libraries it needs (mise run install takes all three browsers, without them)
      - run: pnpm exec playwright install --with-deps chromium
      - run: mise run test:e2e chromium
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 14
