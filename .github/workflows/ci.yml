# The checks a developer runs before a commit (the same mise tasks), plus the end-to-end tests (e2e.yml). Runs on every
# push and pull request, and for a version tag when release.yml calls it before publishing (with e2e: false: the
# release runs them alongside instead). A failed end-to-end test fails nothing (for now: some specs are still flaky).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      e2e:
        description: Run the end-to-end tests too
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # builds the engine once and caches it (.github/actions/setup), so the jobs after it find it built
  engine:
    # a pull request from this repository's own branch is checked by its push already
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

  check:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: mise run check:ci
      - run: mise run typecheck
      - run: mise run quality
      - run: mise run test:unit
      # the Go server's modules and build cache, keyed by go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ hashFiles('server/**/*.go') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
      - run: mise run server:test
      - run: mise run check:examples
      - run: mise run docs:pdf
      - run: mise run docs:html

  # its own workflow, so a release can run it without waiting for it (release.yml)
  e2e:
    needs: engine
    if: inputs.e2e != false
    uses: ./.github/workflows/e2e.yml
