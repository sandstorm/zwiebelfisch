# The Docker image (Dockerfile: the built demo served by the collaboration server) for linux/amd64 and linux/arm64,
# pushed to GitHub's container registry as ghcr.io/<owner>/<repo>: on main (tags `main`, `sha-<short sha>`) and, called
# by release.yml once CI passed, for a version tag v1.2.3 (tags `1.2.3`, `1.2`, `latest`, `sha-…`). A pull request only
# builds it.
name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # no emulation (QEMU) needed: the build stages run on the runner's own platform (Go cross-compiles), and the
      # runtime stage only copies files
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # the description on the image index too: the package page on GitHub shows it from there
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # lower-cased by the action, as the registry requires
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=Zwiebelfisch demo
            org.opencontainers.image.description=The Zwiebelfisch demo, served by its collaboration server with an in-memory fake GitLab
          annotations: |
            org.opencontainers.image.title=Zwiebelfisch demo
            org.opencontainers.image.description=The Zwiebelfisch demo, served by its collaboration server with an in-memory fake GitLab

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
