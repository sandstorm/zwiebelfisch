<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect x="0" y="0" width="320" height="180" fill="#ffffff"/>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="30" y1="40" x2="310" y2="40"/>
    <line x1="30" y1="80" x2="310" y2="80"/>
    <line x1="30" y1="120" x2="310" y2="120"/>
  </g>
  <line x1="30" y1="160" x2="310" y2="160" stroke="#57606a" stroke-width="1.5"/>
  <line x1="30" y1="10" x2="30" y2="160" stroke="#57606a" stroke-width="1.5"/>
  <!-- cold compiles: 18, 95, 410, 820 ms scaled to 140 px for 820 ms -->
  <g fill="#1d5fa8">
    <rect x="45" y="157" width="22" height="3"/>
    <rect x="115" y="144" width="22" height="16"/>
    <rect x="185" y="90" width="22" height="70"/>
    <rect x="255" y="20" width="22" height="140"/>
  </g>
  <!-- incremental compiles: 4, 6, 9, 12 ms -->
  <g fill="#8fb4de">
    <rect x="69" y="158" width="22" height="2"/>
    <rect x="139" y="158" width="22" height="2"/>
    <rect x="209" y="157" width="22" height="3"/>
    <rect x="279" y="157" width="22" height="3"/>
  </g>
</svg>
