<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typst Editor Playground</title>
    <style>
      /* light or dark as the OS; the widget follows the page's color-scheme (see docs/guide/embedding.typ) */
      :root {
        color-scheme: light dark;
        --demo-bg: light-dark(#fff, #0d1117);
        --demo-bar: light-dark(#f6f8fa, #161b22);
        --demo-border: light-dark(#d0d7de, #30363d);
        --demo-text: light-dark(#24292f, #e6edf3);
        --demo-muted: light-dark(#57606a, #9198a1);
        --demo-faint: light-dark(#8c959f, #6e7681);
        --demo-link: light-dark(#0969da, #4493f8);
        --demo-hover: light-dark(#eaeef2, #262c36);
        --demo-ok: light-dark(#1a7f37, #3fb950);
        --demo-warn: light-dark(#9a6700, #d29922);
      }
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: var(--demo-bg); color: var(--demo-text); }
      body { display: flex; flex-direction: column; }
      .demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 4px 8px; font-size: 13px; border-bottom: 1px solid var(--demo-border); background: var(--demo-bar); }
      .demo-bar__group { display: flex; align-items: center; gap: 4px; }
      .demo-bar__label { color: var(--demo-muted); margin-right: 2px; }
      .demo-bar a { padding: 2px 8px; border-radius: 4px; color: var(--demo-link); text-decoration: none; }
      .demo-bar a:hover { background: var(--demo-hover); }
      .demo-bar a[aria-current='page'] { background: var(--demo-link); color: #fff; }
      .demo-bar a[aria-disabled='true'] { color: var(--demo-faint); cursor: not-allowed; background: none; }
      .demo-bar input, .demo-bar select, .demo-bar button { font: inherit; }
      .demo-bar__status { flex: 1 1 18rem; color: var(--demo-muted); }
      .demo-bar__status[data-level='ok'] { color: var(--demo-ok); }
      .demo-bar__status[data-level='warn'] { color: var(--demo-warn); }
      .demo-bar__status code { background: var(--demo-hover); padding: 0 4px; border-radius: 3px; color: var(--demo-text); }
      #editor { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <!-- the playground bar (demo/playground-bar.ts); see docs/architecture/development.typ -->
    <header id="playground" class="demo-bar"></header>
    <div id="editor"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
