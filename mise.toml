[tools]
node = "24.21.0"
pnpm = "10.34.6"
# CLI for reference renders; keep in sync with the typst crate in crates/typst-engine
typst = "0.15.1"
rust = { version = "1.99.0", targets = "wasm32-unknown-unknown" }
# must match the wasm-bindgen crate version pinned in crates/typst-engine/Cargo.toml
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
# wasm-opt for the engine build
"aqua:WebAssembly/binaryen" = "133"
# lint the GitHub workflows (actionlint runs shellcheck on their scripts) and the Dockerfile: mise run check:ci
actionlint = "1.7.12"
hadolint = "2.15.1"
shellcheck = "0.11.0"

[env]
# keep Playwright browsers project-local (pinned with @playwright/test)
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/.cache/ms-playwright"
